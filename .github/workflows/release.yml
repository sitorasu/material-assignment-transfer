name: "Build unitypackage"

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  packageName: "net.sitorasu.material-assignment-transfer"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Build"
        id: "build"
        uses: "docker://ghcr.io/rerigferl/vpm-packager:latest"
        with:
          args: "-z -u"

      - name: "Create Release"
        uses: "softprops/action-gh-release@v3"
        # vpm-packagerがpackage.jsonからバージョンを取ってきてくれる
        # https://github.com/Rerigferl/vpm-packager/blob/60594b1a5dadfa55af3e5cafdc46dd8da34b7ccf/Program.cs#L67
        if: ${{ steps.build.outputs.package-version != '0.0.0' }}
        # with で使える変数の仕様は https://github.com/softprops/action-gh-release#inputs を参照
        with:
          # package.jsonに書いたバージョン文字列と完全一致するタグからリリースを作成する（vプレフィックスはつけない）
          tag_name: ${{ steps.build.outputs.package-version }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.zip-path }}
            ${{ steps.build.outputs.unitypackage-path }}
            ${{ steps.build.outputs.manifest-path }}
